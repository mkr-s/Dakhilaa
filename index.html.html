<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakhilaa - JEE Exam Prep (Offline)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --light: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg) 0%, #1e1b4b 100%);
        }

        .auth-box {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #86efac;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 8px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: var(--light);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--light);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            border-left: 3px solid #ef4444;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .auth-button:hover {
            background: var(--primary-dark);
        }

        .toggle-link {
            text-align: center;
            color: var(--light);
            font-size: 13px;
        }

        .toggle-link button {
            background: none;
            color: var(--primary);
            border: none;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin: 0 4px;
        }

        .dashboard {
            display: none;
            min-height: 100vh;
            background: var(--bg);
        }

        .header {
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
        }

        .sign-out-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-card:hover {
            border-color: var(--primary);
        }

        .stat-icon {
            font-size: 32px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .action-btn {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .action-icon {
            font-size: 32px;
        }

        .action-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .action-desc {
            font-size: 12px;
            color: var(--light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            margin: auto;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--light);
            font-size: 28px;
            cursor: pointer;
        }

        .question-number {
            font-size: 12px;
            color: var(--light);
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 12px;
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .option.selected {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .nav-buttons button {
            flex: 1;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .nav-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .test-results {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .test-results .score {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--light);
            font-size: 12px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .auth-box {
                padding: 30px 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-box">
            <div>
                <span class="auth-title">⚡ Dakhilaa</span>
                <span class="badge">OFFLINE</span>
            </div>
            <div class="subtitle">JEE Exam Preparation - No Internet Needed</div>

            <div class="error-message" id="errorMessage"></div>

            <!-- Sign Up Form -->
            <div id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                </div>
                <button class="auth-button" onclick="handleSignUp()">Sign Up</button>
                <div class="toggle-link">
                    Already have account? <button onclick="toggleForm()">Sign In</button>
                </div>
            </div>

            <!-- Sign In Form -->
            <div id="signinForm" style="display: none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signinEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signinPassword" placeholder="••••••••">
                </div>
                <button class="auth-button" onclick="handleSignIn()">Sign In</button>
                <div class="toggle-link">
                    New user? <button onclick="toggleForm()">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="dashboard">
        <div class="header">
            <h1>Welcome, <span id="userName">User</span>! 👋</h1>
            <button class="sign-out-btn" onclick="handleSignOut()">Sign Out</button>
        </div>

        <div class="container">
            <div class="section-title">Your Progress</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div>
                        <div class="stat-label">Tests Taken</div>
                        <div class="stat-value" id="testsTaken">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div>
                        <div class="stat-label">Questions Solved</div>
                        <div class="stat-value" id="questionsSolved">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div>
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="accuracy">0%</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚡</div>
                    <div>
                        <div class="stat-label">Latest Score</div>
                        <div class="stat-value" id="latestScore">--</div>
                    </div>
                </div>
            </div>

            <div class="section-title">Take a Test</div>
            <button class="action-btn" onclick="startTest()">
                <div class="action-icon">⚡</div>
                <div class="action-text">
                    <div class="action-title">Daily Test</div>
                    <div class="action-desc">10 random JEE questions</div>
                </div>
            </button>
        </div>

        <footer>© 2026 Dakhilaa - Offline Mode (Mukesh)</footer>
    </div>

    <!-- Test Modal -->
    <div id="testModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeTest()">×</button>
            <div id="testContent"></div>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, text: 'A car travels 150 km in 3 hours. Average speed is:', options: ['50 km/h', '45 km/h', '75 km/h', '30 km/h'], correct: 0 },
            { id: 2, text: "Newton's first law of motion is:", options: ['Law of Inertia', 'Law of Acceleration', 'Action-Reaction', 'Gravitation'], correct: 0 },
            { id: 3, text: 'Valence electrons in Carbon:', options: ['3', '4', 'Both 3 and 4', 'Only 4'], correct: 3 },
            { id: 4, text: 'sin(60°) = ?', options: ['√3/2', '1/2', '1', '0'], correct: 0 },
            { id: 5, text: 'SI unit of work:', options: ['Joule', 'Watt', 'Newton', 'Pascal'], correct: 0 },
            { id: 6, text: 'Highest electronegativity:', options: ['Oxygen', 'Nitrogen', 'Fluorine', 'Chlorine'], correct: 2 },
            { id: 7, text: 'If x + 2 = 5, then x = ?', options: ['1', '2', '3', '4'], correct: 2 },
            { id: 8, text: 'Value of g on Earth:', options: ['9.8 m/s²', '10 m/s²', '8.9 m/s²', '5.6 m/s²'], correct: 0 },
            { id: 9, text: 'Avogadro number:', options: ['6.022×10²²', '6.022×10²³', '6.022×10²⁴', '6.022×10²⁵'], correct: 1 },
            { id: 10, text: 'Sum of angles in triangle:', options: ['90°', '180°', '270°', '360°'], correct: 1 }
        ];

        let currentUser = null;
        let currentTest = null;
        let testAnswers = {};

        window.addEventListener('load', () => {
            const user = localStorage.getItem('dakhilaaUser');
            if (user) {
                currentUser = JSON.parse(user);
                showDashboard();
            }
        });

        function toggleForm() {
            const signup = document.getElementById('signupForm');
            const signin = document.getElementById('signinForm');
            signup.style.display = signup.style.display === 'none' ? 'block' : 'none';
            signin.style.display = signin.style.display === 'none' ? 'block' : 'none';
            document.getElementById('errorMessage').classList.remove('show');
        }

        function handleSignUp() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const fullName = document.getElementById('fullName').value;

            if (!email || !password || !fullName) {
                showError('Please fill all fields');
                return;
            }

            const users = JSON.parse(localStorage.getItem('dakhilaaUsers') || '[]');
            if (users.find(u => u.email === email)) {
                showError('Email already registered');
                return;
            }

            const newUser = {
                id: Date.now(),
                email,
                password,
                fullName,
                attempts: []
            };

            users.push(newUser);
            localStorage.setItem('dakhilaaUsers', JSON.stringify(users));
            currentUser = { ...newUser };
            delete currentUser.password;
            localStorage.setItem('dakhilaaUser', JSON.stringify(currentUser));
            showDashboard();
        }

        function handleSignIn() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            const users = JSON.parse(localStorage.getItem('dakhilaaUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showError('Invalid credentials');
                return;
            }

            currentUser = { ...user };
            delete currentUser.password;
            localStorage.setItem('dakhilaaUser', JSON.stringify(currentUser));
            showDashboard();
        }

        function showError(msg) {
            const err = document.getElementById('errorMessage');
            err.textContent = msg;
            err.classList.add('show');
        }

        function showDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('userName').textContent = currentUser.fullName.split(' ')[0];
            loadStats();
        }

        function loadStats() {
            const users = JSON.parse(localStorage.getItem('dakhilaaUsers') || '[]');
            const user = users.find(u => u.id === currentUser.id);

            if (user && user.attempts.length > 0) {
                const total = user.attempts.reduce((s, a) => s + a.total, 0);
                const correct = user.attempts.reduce((s, a) => s + a.correct, 0);
                const acc = total > 0 ? Math.round(correct / total * 100) : 0;

                document.getElementById('testsTaken').textContent = user.attempts.length;
                document.getElementById('questionsSolved').textContent = total;
                document.getElementById('accuracy').textContent = acc + '%';
                document.getElementById('latestScore').textContent = user.attempts[0].total > 0 ?
                    Math.round(user.attempts[0].correct / user.attempts[0].total * 100) + '%' : '--';
            }
        }

        function startTest() {
            currentTest = {
                questions: questions.sort(() => Math.random() - 0.5).slice(0, 10),
                currentQuestion: 0
            };
            testAnswers = {};
            renderQuestion();
            document.getElementById('testModal').classList.add('show');
        }

        function renderQuestion() {
            const q = currentTest.questions[currentTest.currentQuestion];
            let html = `<div class="question-number">Q${currentTest.currentQuestion + 1}/${currentTest.questions.length}</div>
                <div class="question-text">${q.text}</div><div class="options">`;

            q.options.forEach((opt, i) => {
                html += `<div class="option ${testAnswers[q.id] === i ? 'selected' : ''}" onclick="selectAnswer(${i}, ${q.id})">${String.fromCharCode(65+i)}) ${opt}</div>`;
            });

            html += `</div><div class="nav-buttons">
                <button onclick="prevQuestion()" ${currentTest.currentQuestion === 0 ? 'disabled' : ''}>← Prev</button>
                <button onclick="nextQuestion()" ${currentTest.currentQuestion === currentTest.questions.length - 1 ? 'disabled' : ''}>Next →</button>
                <button onclick="submitTest()">Submit</button></div>`;

            document.getElementById('testContent').innerHTML = html;
        }

        function selectAnswer(i, qid) {
            testAnswers[qid] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentTest.currentQuestion > 0) {
                currentTest.currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentTest.currentQuestion < currentTest.questions.length - 1) {
                currentTest.currentQuestion++;
                renderQuestion();
            }
        }

        function submitTest() {
            let correct = 0;
            currentTest.questions.forEach(q => {
                if (testAnswers[q.id] === q.correct) correct++;
            });

            const score = Math.round(correct / currentTest.questions.length * 100);

            const users = JSON.parse(localStorage.getItem('dakhilaaUsers') || '[]');
            const idx = users.findIndex(u => u.id === currentUser.id);
            users[idx].attempts.unshift({
                correct,
                total: currentTest.questions.length,
                score,
                date: new Date().toISOString()
            });
            localStorage.setItem('dakhilaaUsers', JSON.stringify(users));

            document.getElementById('testContent').innerHTML = `
                <div class="test-results">
                    <div class="score">${score}%</div>
                    <p>You got ${correct}/${currentTest.questions.length} correct!</p>
                    <p style="margin-top: 10px; color: var(--light);">Accuracy: ${score}%</p>
                    <button class="auth-button" style="margin-top: 20px;" onclick="closeTest()">Done</button>
                </div>`;

            loadStats();
        }

        function closeTest() {
            document.getElementById('testModal').classList.remove('show');
        }

        function handleSignOut() {
            currentUser = null;
            localStorage.removeItem('dakhilaaUser');
            location.reload();
        }
    </script>
</body>
</html>
